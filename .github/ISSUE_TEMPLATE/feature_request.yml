name: 功能建议
description: 提出与现有网络诊断工具相关的改进。
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明你在什么场景、哪个现有页面或 API 遇到了限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 描述输入、操作与期望结果；涉及检测能力时说明可能的数据来源或运行条件。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 如何判断改进有效
      description: 给出一个具体使用示例或验收条件；界面建议可附草图。
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方式与补充资料
      description: 可补充相关文档、数据源许可或其他工具的行为。
